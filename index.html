<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachshon City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: the town is a full-bleed 3D view. Map controls float over it as dark glass; forms and ID cards rise from the bottom as paper sheets. One daytime world, so one theme by choice. */
  --ink:#1b2130;
  --paper:#fffdf6;
  --sun:#ffd43b;
  --coral:#ff5a4d;
  --sky:#2bb3c0;
  --glass:rgba(20,25,36,.66);
  --muted:#5d6577;
  --display:'Karantina','Fredoka','Arial Hebrew',Arial,sans-serif;
  --body:'Fredoka','Rubik','Arial Hebrew',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#a9c3d6;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
canvas#city{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#city.dragging{cursor:grabbing}

/* over the map */
.glass{background:var(--glass);color:#fff;border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 8px 26px rgba(8,12,20,.28)}
.top{position:fixed;inset:12px 12px auto 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.brand{border-radius:16px;padding:7px 14px 8px}
.brand-name{display:block;font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,36px);line-height:.9;letter-spacing:.05em;color:var(--sun);direction:ltr;white-space:nowrap}
.brand-sub{display:block;font-size:13px;font-weight:500;opacity:.92}
.chip{border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.ctrl{position:fixed;inset-inline-start:12px;bottom:86px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;z-index:5}
.ctrl button{appearance:none;border:0;background:transparent;color:#fff;width:46px;height:44px;display:grid;place-items:center;cursor:pointer}
.ctrl button+button{border-top:1px solid rgba(255,255,255,.14)}
.ctrl button:active{background:rgba(255,255,255,.16)}
.ctrl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#compass svg{width:26px;height:26px;stroke:none}
.dock{position:fixed;inset:auto 12px 14px 12px;display:flex;gap:9px;justify-content:center;align-items:flex-end;pointer-events:none;z-index:5}
.dock>*{pointer-events:auto}
.dock .btn{border:0;box-shadow:0 8px 22px rgba(8,12,20,.3)}
.dock .btn.ghost{background:var(--glass);color:#fff;border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.dock .btn:active{transform:translateY(2px)}
.dock .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
@media (max-width:420px){.dock .btn{padding:11px 12px;font-size:15px}}
.hint{position:fixed;inset-inline:0;top:98px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);text-align:center;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;z-index:4;transition:opacity .5s;pointer-events:none}
.hint.gone{opacity:0}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(10,16,28,.2) 100%)}
.labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.slabel{position:absolute;left:0;top:0;white-space:nowrap;font-weight:600;font-size:13px;color:#fff;text-shadow:0 0 3px rgba(10,14,22,.95),0 1px 5px rgba(10,14,22,.8),0 0 1px #000;will-change:transform,opacity;transition:opacity .25s}
.plabel{position:absolute;left:0;top:0;white-space:nowrap;font-weight:600;font-size:12px;color:var(--ink);background:var(--sun);border-radius:999px;padding:2px 9px;box-shadow:0 3px 10px rgba(8,12,20,.35)}
.plabel[hidden]{display:none}
#btn-chat{display:none}
.walking #btn-chat{display:block}
.chatbar{position:fixed;inset:62px 12px auto 12px;z-index:8;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-radius:16px;max-width:520px;margin:0 auto}
.chatbar[hidden]{display:none}
.chatbar input[type=text]{flex:1;min-width:0;width:auto;padding:8px 12px;font-size:16px;color:var(--ink);border-width:2px}
.chatbar .x{position:static;flex:none;color:var(--ink);width:36px;height:36px;border-width:2px;line-height:1;padding:0}
.chatline{flex-basis:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0;font-size:12.5px;color:rgba(255,255,255,.88)}
.chatline button{appearance:none;border:0;background:none;color:var(--sun);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:2px 0}
.mysay{position:fixed;inset:62px 12px auto 12px;margin:0 auto;width:max-content;max-width:min(330px,calc(100% - 24px));z-index:6;background:#fff;color:var(--ink);border-radius:14px;padding:7px 12px 10px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(8,12,20,.3);text-align:center;overflow:hidden;overflow-wrap:anywhere;pointer-events:none}
.mysay[hidden]{display:none}
.mysay i{position:absolute;inset:auto 0 0 0;height:4px;background:var(--sun);transform-origin:right center;animation:sayleft 20s linear forwards}
@keyframes sayleft{to{transform:scaleX(0)}}
.psay{position:absolute;left:0;top:0;width:max-content;max-width:200px;font-size:13px;font-weight:600;line-height:1.25;color:var(--ink);background:#fff;border-radius:12px;padding:5px 10px;box-shadow:0 4px 12px rgba(8,12,20,.35);text-align:center;overflow-wrap:anywhere}
.psay::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;margin-left:-4.5px;background:#fff;transform:rotate(45deg)}
.psay[hidden]{display:none}
.club .chatbar,.club .mysay{display:none}
.shiftbar{position:fixed;inset:58px 10px auto 10px;margin:0 auto;max-width:430px;z-index:5;border-radius:16px;padding:8px 10px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;color:#fff;overflow:hidden}
.shiftbar[hidden]{display:none}
.shiftbar .sh-time{grid-row:1/3;font-family:var(--display);font-size:38px;line-height:.9;color:var(--sun);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.shiftbar .sh-job{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shiftbar .sh-count{font-size:13px;color:rgba(255,255,255,.9);grid-column:2}
.shiftbar .sh-end{grid-row:1/3;grid-column:3;appearance:none;border:2px solid rgba(255,255,255,.75);background:none;color:#fff;font:inherit;font-weight:600;font-size:13px;border-radius:999px;padding:6px 11px;cursor:pointer}
.shiftbar .sh-line{grid-column:1/4;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:5px;padding-top:6px;border-top:1px solid rgba(255,255,255,.22);min-height:30px}
.shiftbar .sh-arrow{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}
.shiftbar .sh-arrow[hidden]{display:none}
.shiftbar .sh-bar{position:absolute;inset:auto 0 0 0;height:4px;background:var(--sun);transform:scaleX(0);transform-origin:right center}
.shiftbar.shpop .sh-count{color:var(--sun)}
.onshift .mysay,.onshift .chatbar{top:150px}
.stall{position:fixed;inset:auto 8px 70px 8px;margin:0 auto;max-width:440px;z-index:5;border-radius:18px;padding:10px;color:#fff;display:grid;gap:8px;background:rgba(22,27,40,.86)}
.stall[hidden]{display:none}
.st-order{background:#fffdf6;color:var(--ink);border-radius:13px;padding:8px 11px 12px;position:relative;overflow:hidden;min-height:62px}
.st-order b{display:block;font-size:12.5px;color:#5b6272;font-weight:600}
.st-order span{font-weight:700;font-size:16px;line-height:1.25}
.st-pat{position:absolute;inset:auto 0 0 0;height:5px;background:#e6e2d6}
.st-pat i{display:block;height:100%;background:#2f8f46;transform-origin:right center}
.st-rows{display:grid;gap:7px}
.st-group{display:flex;flex-wrap:wrap;gap:6px}
.st-group+.st-group{padding-top:7px;border-top:1px solid rgba(255,255,255,.2)}
.st-chip{appearance:none;font:inherit;font-weight:700;font-size:14.5px;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:38px}
.st-chip.st-on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.st-chip:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.st-foot{display:flex;gap:8px;align-items:center;justify-content:space-between}
.st-foot span{font-size:13.5px;font-weight:600;min-height:18px;line-height:1.25}
.st-foot .btn{flex:none}
.stalling .joy,.stalling #act{display:none!important}
.starrow{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.starbtn{appearance:none;font:inherit;font-size:32px;line-height:1;width:54px;height:54px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:#c9c5b8;cursor:pointer;padding:0}
.starbtn:hover,.starbtn:focus-visible{background:#fff6cf;outline:none}
.starbtn.ston{color:#e0a800;background:#fff6cf}
.starbtn:disabled{cursor:default}
.club .shiftbar{display:none}
.shsum{font-size:19px;font-weight:700;margin:0 0 8px}
.mcolors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.mcolor{appearance:none;border:3px solid var(--ink);border-radius:14px;height:64px;cursor:pointer;display:grid;place-items:end center;padding:0 0 6px;font:inherit}
.mcolor span{background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.mcolor:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.qopt:disabled{opacity:.5;cursor:default;background:#eee}
.shiftbar .sh-line{pointer-events:auto}
.cvcard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 4px}
.cvcard b{display:block;font-size:19px}
.cvcard span{font-size:13px;color:#3a4254}
.cvcard p{margin:0;font-size:14px}
.cvcard .nhead{margin:8px 0 2px;font-size:14px}
.cvchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.cvchip{appearance:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.cvchip.cvon{background:var(--sun);box-shadow:0 2px 0 var(--ink)}
.cvwhy{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14.5px;cursor:pointer}
.cvwhy input{flex:none;width:18px;height:18px;accent-color:var(--ink)}
.reqs{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.reqs li{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.reqs i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
.reqs .reqok i{background:#2f8f46}
.reqs .reqno i{background:#c9261e}
.joy{position:fixed;left:18px;bottom:92px;width:124px;height:124px;border-radius:50%;z-index:5;display:none;touch-action:none;cursor:grab}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(8,12,20,.4);pointer-events:none}
#btn-map{display:none}
.act{position:fixed;inset-inline:0;bottom:78px;margin:0 auto;width:max-content;max-width:calc(100% - 180px);z-index:6;white-space:normal;text-align:center}
.act[hidden]{display:none}
.fade{position:fixed;inset:0;background:#0b0e14;opacity:0;pointer-events:none;z-index:7;transition:opacity .22s}
.fade.on{opacity:1}
.plain{margin:0 0 14px;padding-inline-start:20px}
.walking .joy{display:block}
.drv{position:fixed;inset:0;z-index:6;pointer-events:none}
.drv>*{pointer-events:auto}
.drv-k{position:fixed;border:3px solid var(--ink,#1b2130);border-radius:18px;font:inherit;font-weight:800;color:#1b2130;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;box-shadow:0 4px 0 #1b2130;display:grid;place-items:center;padding:0;cursor:pointer}
.drv-k.on{transform:translateY(3px);box-shadow:0 1px 0 #1b2130}
.drv-arrow{bottom:92px;width:66px;height:66px;background:rgba(255,255,255,.94)}
.drv-arrow svg{width:36px;height:36px;fill:none;stroke:#1b2130;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
#drv-left{left:14px}#drv-right{left:88px}
.drv-sig{bottom:170px;width:66px;height:44px;background:#fff3c4;font-size:19px;touch-action:manipulation}
#drv-sl{left:14px}#drv-sr{left:88px}
.drv-sig.on{background:#ffd43b}.drv-sig.lit{background:#ff9f1c;box-shadow:0 4px 0 #1b2130,0 0 18px #ffb703}
.drv-pedal{bottom:92px;width:70px;color:#fff;font-size:17px}
.drv-pedal.gas{right:14px;height:108px;background:#22a565}
.drv-pedal.brake{right:92px;height:76px;background:#e5484d}
.drv-drift{right:14px;bottom:212px;width:70px;height:44px;background:#8a4fe0;color:#fff;font-size:15px}
.drv-drift[hidden]{display:none}
.drv-top{position:fixed;right:12px;top:12px;padding:5px 12px;border-radius:16px;display:flex;align-items:baseline;gap:6px;color:#fff;direction:rtl}
.drv-top b{font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.drv-top small{font-size:12px;opacity:.85}
.drv-top span{font-size:12px;opacity:.85;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drv-exit{position:fixed;right:12px;top:62px}
.drv-exit:disabled{opacity:.45}
.driving .joy,.driving #act{display:none!important}
.drv-rec{position:fixed;right:12px;top:106px;padding:4px 10px;border-radius:12px;color:#fff;font-size:13px;font-weight:700}
.ticket{position:fixed;inset-inline:0;top:74px;margin:0 auto;width:min(300px,calc(100% - 40px));z-index:21;display:flex;flex-direction:column;gap:2px;padding:10px 14px 12px;border:3px solid #1b2130;border-radius:6px 6px 16px 16px;background:#fffdf2;color:#1b2130;box-shadow:0 8px 0 rgba(27,33,48,.25);text-align:center}
.ticket[hidden]{display:none}
.ticket b{font-size:20px;letter-spacing:.3px}
.ticket span{font-size:15px;font-weight:600}
.ticket small{font-size:14px;font-weight:800}
.ticket.fine{border-top:12px solid #e5484d}.ticket.fine b,.ticket.fine small{color:#c1272d}
.ticket.warn{border-top:12px solid #ffb703}.ticket.warn small{color:#8a5a00;font-weight:600}
.ayahead{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.ayahead canvas{width:76px;height:76px;border:3px solid var(--ink,#1b2130);border-radius:50%;background:#dfe8f5}
.ayasay{font-weight:700;font-size:17px;margin:0 0 10px}
.ayaq{font-weight:800;font-size:18px;margin:6px 0 10px}
.walking #btn-map{display:block}
.walking #btn-main,.walking #btn-dir,.walking #btn-all,.walking #btn-walk,.walking .ctrl,.walking .pin,.walking .brand{display:none}
.walking .top{justify-content:flex-end}
.pin{position:fixed;left:0;top:0;z-index:3;transform:translate(-50%,-100%);pointer-events:none;background:var(--sun);color:var(--ink);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;box-shadow:0 4px 12px rgba(8,12,20,.35);white-space:nowrap}
.pin::after{content:"";position:absolute;bottom:-5px;left:50%;width:10px;height:10px;background:var(--sun);transform:translateX(-50%) rotate(45deg);z-index:-1}
.pin[hidden],.bubble[hidden],.ctrl[hidden]{display:none}
.bubble{position:fixed;left:0;top:0;z-index:6;transform:translate(-50%,-100%);background:var(--paper);border-radius:16px;padding:9px 13px 11px;box-shadow:0 10px 30px rgba(8,12,20,.38);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:150px;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-7px;left:50%;width:16px;height:16px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bubble strong{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.bubble span{font-size:13px;color:var(--muted);font-weight:500}
.veil{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:linear-gradient(#8fb4d6,#cfdfe6 55%,#8aa56a 55%,#6f8f52);transition:opacity .6s}
.veil.gone{opacity:0;pointer-events:none}
.veil div{text-align:center;border-radius:20px;padding:16px 22px}
.veil b{display:block;font-family:var(--display);font-size:44px;line-height:.9;color:var(--sun);letter-spacing:.05em;direction:ltr}
.veil span{font-weight:500}
.nogl{position:fixed;inset:120px 16px auto 16px;margin:0 auto;max-width:440px;z-index:4;border-radius:18px;padding:14px 16px;text-align:center;font-weight:500}
.nogl[hidden]{display:none}

/* paper: buttons, sheets, forms, the ID card */
.btn{appearance:none;border:3px solid var(--ink);background:var(--sun);border-radius:14px;padding:11px 16px;font-weight:700;font-size:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.coral{background:var(--coral);color:#fff}
.btn.small{padding:6px 12px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.icon{padding:11px 13px;line-height:1}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(15,19,28,.5);z-index:9}
.scrim[hidden],.sheet[hidden],.toast[hidden]{display:none}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:520px;max-height:88%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 18px 22px;z-index:10;box-shadow:0 -6px 0 rgba(27,33,48,.25);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.x{appearance:none;border:3px solid var(--ink);background:var(--paper);border-radius:50%;width:38px;height:38px;font-size:18px;font-weight:700;cursor:pointer;flex:none}
.steps{display:flex;gap:6px;margin:0 0 14px;padding:0;list-style:none;font-size:13px;font-weight:600;color:var(--muted)}
.steps li{flex:1;border-top:5px solid #d8d4c6;padding-top:5px}
.steps li.on{border-color:var(--ink);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label,.field>.lab{font-weight:600;font-size:15px}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:#c62828;font-weight:600;margin:0 0 10px;min-height:1.2em}
input[type=text]{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:17px;width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:block;border:3px solid var(--ink);border-radius:12px;padding:8px 16px;font-weight:600;background:#fff;min-width:64px;text-align:center}
.pill input:checked+span{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.pill input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.pill input:disabled+span{opacity:.4;text-decoration:line-through}
.streets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.streets .pill span{text-align:start;padding:8px 12px}
.streets small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:440px){.houses{grid-template-columns:repeat(2,1fr)}}
.hcard{position:relative}
.hcard input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.hcard span{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 5px 7px;font-size:13px;font-weight:600;text-align:center;line-height:1.15;height:100%}
.hcard canvas{width:100%;aspect-ratio:10/11;display:block;border-radius:8px;background:#bcdcf5}
.hcard input:checked+span{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.hcard input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.ngrid.classic{grid-template-columns:repeat(4,1fr)}
.ncard{appearance:none;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 5px 7px;text-align:center;line-height:1.15;cursor:pointer;min-width:0}
.ncard canvas{width:100%;height:auto;aspect-ratio:10/11;display:block;border-radius:8px;background:#bcdcf5}
.ncard b{font-size:13.5px}
.ncard .nsub{font-size:12px;font-weight:600;color:#3a4254}
.ncard.nmine{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.ncard:disabled{cursor:default}
.ncard:disabled:not(.nmine){opacity:.65}
.ncard:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.nhead{margin:12px 0 6px;font-size:16px;font-weight:700}
.nbig{display:block;width:min(100%,290px);height:auto;margin:0 auto 10px;border-radius:14px;border:3px solid var(--ink);background:#bcdcf5}
.nprice{font-weight:700;margin:0 0 6px}
.qprog{display:flex;gap:6px;margin:0 0 10px}
.qprog i{flex:1;height:7px;border-radius:4px;background:#d9dde6}
.qprog i.qdone{background:var(--ink)}
.qprog i.qnow{background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink)}
.qq{font-size:19px;font-weight:700;margin:0 0 12px;line-height:1.25}
.qopts{display:grid;gap:8px;margin:0 0 14px}
.qopt{appearance:none;font:inherit;font-weight:600;font-size:16px;color:var(--ink);text-align:start;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;line-height:1.25}
.qopt:hover,.qopt:focus-visible{background:var(--sun);outline:none;box-shadow:0 3px 0 var(--ink)}
.jpic{display:block;border-radius:12px;border:3px solid var(--ink);height:auto;flex:none}
.jnow{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.jnow b{font-size:18px;display:block;margin-bottom:4px}
.jnow p{margin:0 0 6px}
.jlist{display:grid;gap:8px;margin:0 0 12px}
.jrow{appearance:none;font:inherit;color:var(--ink);display:flex;gap:10px;align-items:center;text-align:start;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px 6px 6px;cursor:pointer}
.jrow .jpic{width:64px;border-width:2px;border-radius:9px}
.jrow b{display:block;font-size:15.5px}
.jrow small{display:block;font-size:12.5px;line-height:1.25;color:#3a4254}
.jrow.jmine{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.jrow:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (max-width:430px){.ngrid.classic .ncard b{font-size:11.5px}.ngrid.classic .ncard .nsub{font-size:11px}.ncard{padding:4px 3px 6px;border-width:2px}}
.dots{display:flex;gap:10px;flex-wrap:wrap}
.dot{position:relative;width:38px;height:38px}
.dot input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.dot span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--ink)}
.dot input:checked+span{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.dot input:focus-visible+span{outline:3px solid var(--sky);outline-offset:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:space-between;margin-top:6px}
.sheet form>.row.end{position:sticky;bottom:0;margin-inline:-18px;padding:10px 18px 4px;background:var(--paper);box-shadow:0 -10px 12px -10px rgba(27,33,48,.3)}
.facebox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.face{width:128px;height:128px;border:3px solid var(--ink);border-radius:18px;display:block;background:#fff}
.addr{background:#eaf7df;border:3px dashed var(--ink);border-radius:14px;padding:10px 12px;font-weight:600;margin:0 0 14px}
.idcard{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--ink);margin-bottom:16px}
.idhead{background:var(--ink);color:var(--paper);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;padding:8px 14px}
.idhead b{font-family:var(--display);font-size:28px;line-height:1;font-weight:700}
.idhead i{font-style:normal;font-family:var(--display);font-size:24px;color:var(--sun);direction:ltr;letter-spacing:.04em}
.idbody{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;align-items:start;background:repeating-linear-gradient(135deg,#fff 0 14px,#f6fbef 14px 28px)}
.idbody .face{width:112px;height:112px}
.idpics{display:flex;flex-direction:column;gap:8px}
.idhouse{width:112px;aspect-ratio:10/11;border:3px solid var(--ink);border-radius:14px;display:block;background:#bcdcf5}
@media (max-width:420px){.idbody{gap:10px;padding:12px}.idbody .face,.idhouse{width:92px}.idbody .face{height:92px}}
.idfields{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:15px}
.idfields dt{color:var(--muted);font-weight:500;font-size:13px;align-self:center}
.idfields dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.idfields dd.big{font-size:21px;font-weight:700}
.idfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-top:3px solid var(--ink);background:var(--sun);font-weight:600;font-size:13px}
.stamp{border:3px solid var(--coral);color:var(--coral);border-radius:8px;padding:1px 8px;transform:rotate(-6deg);font-weight:700;font-size:14px;background:rgba(255,255,255,.7)}
.bars{flex:1;min-width:0;text-align:center;font-family:monospace;letter-spacing:-1px;direction:ltr;font-size:15px;white-space:nowrap;overflow:hidden}
.dir{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.dir h3{font-size:14px;margin:10px 0 2px;color:var(--muted);font-weight:600}
.dir button{appearance:none;width:100%;display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 10px;cursor:pointer;text-align:start}
.dir button canvas{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);flex:none}
.dir button b{display:block;font-size:16px;overflow-wrap:anywhere}
.dir button small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.empty{border:3px dashed var(--ink);border-radius:14px;padding:16px;text-align:center;font-weight:500;background:#eaf7df;margin:0 0 12px}
/* inside the community centre: the events board */
textarea{font:inherit;color:inherit;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:17px;width:100%;min-height:104px;resize:vertical;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.evlist{list-style:none;margin:8px 0 4px;padding:0;display:flex;flex-direction:column;gap:18px}
.ev{position:relative;border:3px solid var(--ink);border-radius:16px;background:#fff6bf;padding:18px 14px 12px;box-shadow:0 4px 0 var(--ink)}
.ev:nth-child(4n+2){background:#dcf1ff}
.ev:nth-child(4n+3){background:#ffe1ea}
.ev:nth-child(4n){background:#e2f5d5}
.ev::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--coral);border:3px solid var(--ink)}
.ev h3{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.evx{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.evimg{display:block;width:100%;max-height:320px;object-fit:contain;border:3px solid var(--ink);border-radius:12px;margin-bottom:10px;background:rgba(255,255,255,.6)}
.evimg.none{display:grid;place-items:center;height:84px;color:var(--muted);font-size:14px;font-weight:500;border-style:dashed}
.evmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted)}
.evprev{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.evprev canvas{max-width:100%;max-height:170px;width:auto;height:auto;border:3px solid var(--ink);border-radius:12px;display:block}
.filebtn{position:relative;display:inline-block;align-self:flex-start}
.filein{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--sky);outline-offset:2px}

/* the computers: a dark monitor frame around a light screen */
.sheet[data-kind=pc]{background:#151b27;color:#e8edf5;border-color:#06080c;max-height:94%;padding:14px 12px 18px}
.sheet[data-kind=pc] h2{color:var(--sun)}
.sheet[data-kind=pc] .x{background:#262f40;color:#fff;border-color:#06080c}
.pcbar{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:13px;font-weight:500;color:#a9b4c7;margin:-4px 2px 10px}
.pcscreen{background:#eef3f8;color:var(--ink);border-radius:14px;padding:12px;box-shadow:0 0 0 3px #06080c,0 0 28px rgba(43,179,192,.3)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#d5dee9;border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{appearance:none;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;font-size:16px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.pchead{margin:0 0 8px;font-size:15px}
.pcscreen .field>.lab{font-size:13px;color:var(--muted)}
.pcscreen .pill span{padding:7px 12px;min-width:0;border-width:2px;border-radius:10px;font-size:15px}
.days small{display:block;font-size:11px;font-weight:700;color:var(--coral);line-height:1}
.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tt li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 12px;border-inline-start:8px solid var(--c,#999)}
.tt .num{font-family:var(--display);font-size:28px;line-height:1;min-width:46px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
.tt .num small{font-family:var(--body);font-size:11px;font-weight:600;line-height:1.1}
.tt .sub b{display:block;font-size:17px;line-height:1.2}
.tt .sub small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.ttwrap{overflow-x:auto;border-radius:12px;background:#fff}
.ttweek{border-collapse:collapse;width:100%;min-width:300px;font-size:12px;table-layout:fixed}
.ttweek th,.ttweek td{border:1px solid #dbe3ec;padding:6px 2px 4px;text-align:center;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.ttweek thead th{background:var(--ink);color:#fff;font-size:13px}
.ttweek tbody th,.ttweek thead th:first-child{width:22px}
.ttweek tbody th{color:var(--muted);background:#f3f6fa}
.ttweek td{box-shadow:inset 0 4px 0 var(--c,transparent);height:46px}
.ttweek td.now{background:#fff6cf}
.ttweek thead th.now{background:var(--sun);color:var(--ink)}
.nextup{margin:0 0 10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:1px}
.nextup small{color:var(--sun);font-weight:600;font-size:13px}
.nextup b{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.nextup span{font-size:14px;font-weight:500;opacity:.92}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 12px;border-inline-start:8px solid var(--coral)}
.trow.gen{background:transparent;border:2px dashed #b3bfce;padding:6px 12px}
.trow.past{opacity:.55}
.trow.now{box-shadow:0 0 0 3px var(--sun)}
.tdate{display:flex;flex-direction:column;align-items:center;min-width:46px;flex:none}
.tdate b{font-family:var(--display);font-size:28px;line-height:.95}
.tdate small{font-size:12px;font-weight:600;color:var(--muted)}
.twhat{min-width:0}
.twhat b{display:block;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.twhat small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
/* the clubs: a full-screen stage for the games, and the coins they pay */
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.coins{display:flex;align-items:center;gap:6px;font-weight:700}
.coins[hidden]{display:none}
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#ffd43b 45%,#d99a00);box-shadow:inset 0 0 0 .12em #b77f00;flex:none}
.game{position:fixed;inset:0;z-index:12;background:#10151f;color:#fff;display:flex;flex-direction:column;padding:10px 12px 14px;overflow:auto}
.game[hidden]{display:none}
.game-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}
.game-head h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:0;color:var(--sun);flex:1}
.game-head .x{background:#262f40;color:#fff;border-color:#06080c}
.gscore{font-weight:700;font-size:17px;background:#262f40;border-radius:999px;padding:5px 14px;white-space:nowrap;direction:ltr}
.gscore:empty{display:none}
.game-body{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:560px;margin:0 auto;min-height:0}
.gcanvas{width:100%;flex:1;min-height:240px;max-height:660px;display:block;border-radius:18px;touch-action:none;background:#1c2433}
.gtip{margin:0;font-size:14px;font-weight:500;color:#b9c3d4;text-align:center}
.gstat{margin:0;font-size:18px;font-weight:700;text-align:center;min-height:1.4em}
.gend{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.gend h3{font-family:var(--display);font-size:54px;line-height:.95;margin:0;color:var(--sun);text-wrap:balance}
.gend p{margin:0;font-weight:500}
.gcoins{display:flex;align-items:center;gap:8px;font-size:22px}
.gcoins b{font-family:var(--display);font-size:60px;line-height:1;color:var(--sun)}
.gnote{color:#b9c3d4;font-size:14px;min-height:1.4em}
.glevels{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.glevels .btn{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:normal;color:var(--ink)}
.glevels small{font-size:13px;font-weight:500}
.game .btn{color:var(--ink)}
.game .btn.coral{color:#fff}
.cboard{--bs:min(calc(100vw - 24px),calc(100vh - 210px),520px);width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:4px solid #06080c;border-radius:10px;overflow:hidden;font-size:calc(var(--bs)/8*.76);flex:none}
.sq{appearance:none;border:0;border-radius:0;padding:0;margin:0;display:grid;place-items:center;line-height:1;font-family:'Segoe UI Symbol','Noto Sans Symbols2','Noto Sans Symbols','Apple Symbols','DejaVu Sans',sans-serif;font-size:inherit;cursor:pointer;position:relative;min-width:0;min-height:0;overflow:hidden}
.sq.lt{background:#f4ecd0}
.sq.dk{background:#6aa69c}
.sq.wp{color:#fff;-webkit-text-stroke:1.5px #1b2130;paint-order:stroke fill}
.sq.bp{color:#1b2130}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,212,59,.4)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,212,59,.78)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,90,77,.7)}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(27,33,48,.36)}
.sq.tk::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(255,90,77,.9)}
.sq:focus-visible{outline:3px solid var(--sky);outline-offset:-3px;z-index:1}
.kcall{margin:0;font-family:var(--display);font-size:48px;line-height:1;min-height:1em;text-align:center;color:#fff}
.kcall.good{color:#8fe388}
.kcall.bad{color:#ff8d84}
.kbar{width:100%;height:10px;border-radius:999px;background:#262f40;overflow:hidden;flex:none}
.kbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:999px}
.kbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.kbtns .btn{padding:16px 4px;font-size:19px}
/* renovation mode: the room from above, the storage tray below */
#btn-reno{display:none}
.walking #btn-reno:not([hidden]){display:block}
.reno .joy,.reno #btn-map,.reno #act{display:none}
.renobar{position:fixed;inset:auto 8px 8px 8px;margin:0 auto;max-width:560px;z-index:6;border-radius:18px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.renobar[hidden]{display:none}
.reno-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.reno-sel b{font-size:17px}
.reno-sel .row{gap:6px}
.reno-tip{margin:0;font-size:14px;font-weight:500}
.reno-head{display:flex;gap:8px;align-items:baseline;font-size:13px;opacity:.9}
.reno-tray{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tray-item{appearance:none;flex:none;width:84px;border:2px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;line-height:1.1;cursor:pointer;text-align:center}
.tray-item:active{background:rgba(255,255,255,.25)}
.fthumb{width:100%;aspect-ratio:1;border-radius:9px;display:block;background:#eef1f5}
.reno-row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.renobar .btn{color:var(--ink)}
/* shops: the chip on the main screen, the forms, the product designer */
.chipbtn{appearance:none;pointer-events:auto;cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--sun);border:0;box-shadow:0 4px 14px rgba(8,12,20,.3)}
.chipbtn[hidden]{display:none}
.avchip{display:flex;align-items:center;gap:7px;padding:3px 12px 3px 4px;background:#fff}
.avchip canvas{width:34px;height:34px;border-radius:50%;display:block}
.walking .avchip{display:none}
.avstage{display:grid;place-items:center;margin:0 0 10px}
.avstage canvas{width:210px;height:266px;border-radius:18px;border:3px solid var(--ink);display:block}
.avsw{display:flex;flex-wrap:wrap;gap:8px}
.avdot{appearance:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}
.avdot.avon{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--sky)}
.avdot:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.avrange input{width:100%;accent-color:var(--ink);height:28px}
.avval{font-weight:700}
.avtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 12px;background:#ece8dc;border-radius:14px;padding:4px}
.avtab{appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--ink);border-radius:11px;padding:8px 6px;cursor:pointer}
.avtab.avtabon{background:var(--ink);color:#fff}
.avtab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.avpane[hidden]{display:none}
.wopts{display:flex;flex-wrap:wrap;gap:6px}
.wopt{appearance:none;display:flex;align-items:center;gap:7px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;min-height:36px}
.wopt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.wopt.won{background:var(--sun);box-shadow:0 2px 0 var(--ink)}
.wopt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.logo{border-radius:50%;display:block;flex:none}
.logos{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;justify-items:center}
@media (max-width:440px){.logos{grid-template-columns:repeat(6,1fr)}}
.logopick{position:relative;display:block;border-radius:50%}
.logopick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.logopick input:checked+canvas{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.logopick input:focus-visible+canvas{outline:3px solid var(--sky);outline-offset:6px}
.shophead{display:flex;gap:12px;align-items:center;margin:0 0 10px}
.shophead b{display:block;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.shophead small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.prods,.sales{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.prods li{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 8px}
.prods li>span{flex:1;min-width:0}
.prods b{display:block;overflow-wrap:anywhere}
.prods small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.prods .fthumb{width:64px;border:2px solid var(--ink);flex:none}
.prods .vpic{width:84px;height:56px;border:2px solid var(--ink);border-radius:10px;flex:none;background:#eef1f5}
.prods .own{font-weight:800;color:#1a8f55;white-space:nowrap;padding:0 6px}
.sales li{font-size:14px;font-weight:500;border-bottom:2px dashed #d8d4c6;padding:4px 0}
.subhead{font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.bases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:440px){.bases{grid-template-columns:repeat(3,1fr)}}
.tray-item.dark{width:auto;color:var(--ink);border:3px solid var(--ink);background:#fff;font-size:13px}
.pview{display:block;width:min(240px,70%);aspect-ratio:1;margin:0 auto 12px;border:3px solid var(--ink);border-radius:18px;background:#eef1f5}
.pstick{position:sticky;top:-16px;z-index:2;background:var(--paper);margin:0 -18px 10px;padding:8px 0 6px;box-shadow:0 8px 10px -8px rgba(27,33,48,.3)}
.pstick .pview{width:min(190px,52%);margin:0 auto}
.btn.act{white-space:normal}
.pview.small{width:132px}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spots .pill span{text-align:start;padding:7px 12px}
.spots small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
/* the clubs in 3D: the game is the room itself; this layer only carries the title, the score and what is touched */
.game[data-mode="3d"]{background:transparent;pointer-events:none}
.game[data-mode="3d"] .game-head{pointer-events:auto;background:var(--glass);border-radius:16px;padding:6px 12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.game[data-mode="3d"] .game-head h2{font-size:26px}
.game[data-vs] .game-head h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.game[data-mode="3d"] .game-body{justify-content:flex-end;pointer-events:none}
.game[data-mode="3d"].ended{background:rgba(16,21,31,.8);pointer-events:auto}
.game[data-mode="3d"].ended .game-body{justify-content:center;pointer-events:auto}
.g3tip{background:var(--glass);border-radius:12px;padding:6px 12px;color:#fff;max-width:100%}
.g3card{pointer-events:auto;background:rgba(16,21,31,.9);border-radius:20px;padding:18px 16px;margin:auto 0}
.g3btn{pointer-events:auto}
.k3call{position:absolute;top:66px;inset-inline:0;text-shadow:0 2px 12px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.8);pointer-events:none}
.ktarget{appearance:none;position:fixed;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid #fff;background:rgba(255,212,59,.88);pointer-events:auto;cursor:pointer;padding:0;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.ktarget.def{background:rgba(255,72,60,.9)}
.ktarget i{position:absolute;inset:-5px;border-radius:50%;border:5px solid #fff;pointer-events:none}
.ktarget[hidden]{display:none}
.game.hit::after{content:"";position:fixed;inset:0;background:rgba(255,40,30,.38);pointer-events:none}
.club .joy,.club #btn-map,.club #act,.club .top{display:none}
.toast{position:fixed;inset-inline:0;top:98px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600;z-index:20;text-align:center;box-shadow:0 8px 26px rgba(8,12,20,.35)}
@media (max-width:699px){.hint{top:142px}}
@media (min-width:700px){.brand-name{font-size:42px}.hint,.toast{top:106px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn,.veil,.slabel,.hint,.fade{transition:none}}
</style>

<body>
<canvas id="city" role="img" aria-label="מפת תלת־ממד של העיר Nachshon City: כיכר עם מזרקה, שישה רחובות ובתי התושבים"></canvas>
<div class="vig" aria-hidden="true"></div>
<div id="labels" class="labels" aria-hidden="true"></div>

<header class="top">
  <div class="brand glass"><span class="brand-name">NACHSHON CITY</span><span class="brand-sub">העיר של כיתת נחשון</span></div>
  <div class="chips"><div class="chip glass" id="status" role="status">טוען תושבים…</div><div class="chip glass coins" id="coins" role="img" hidden><i class="coin" aria-hidden="true"></i><span id="coins-n">0</span></div><button id="btn-shop" class="chip chipbtn" type="button" hidden>החנות שלי</button><button id="btn-avatar" class="chip chipbtn avchip" type="button" hidden>האווטאר שלי</button></div>
</header>

<div id="mypin" class="pin" hidden>הבית שלי</div>
<div id="bubble" class="bubble" hidden>
  <strong id="bubble-name"></strong>
  <span id="bubble-sub"></span>
  <button id="bubble-open" class="btn small" type="button">תעודת זהות</button>
</div>

<p id="hint" class="hint glass"></p>
<div id="nogl" class="nogl glass" hidden>המכשיר הזה לא מצליח להציג את העיר בתלת־ממד. ההרשמה, ספר התושבים ותעודות הזהות עובדים כרגיל.</div>

<div id="joy" class="joy glass" role="application" aria-label="ג׳ויסטיק הליכה"><i id="joy-k"></i></div>
<div class="ctrl glass" role="group" aria-label="שליטה במפה">
  <button id="compass" type="button" aria-label="צפון למעלה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 15.6 12H8.4z" fill="#ff5a4d"/><path d="M12 21.5 8.4 12h7.2z" fill="#fff"/></svg></button>
  <button id="turn" type="button" aria-label="לסובב את המבט"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 3.5v4.4h-4.4"/></svg></button>
  <button id="tilt" type="button" aria-label="לשנות את זווית המבט"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5 12 21l9-3.5"/><path d="M3 12.5 12 16l9-3.5"/><path d="M12 3 3 7.5 12 11l9-3.5z"/></svg></button>
  <button id="zin" type="button" aria-label="להתקרב"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zout" type="button" aria-label="להתרחק"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</div>

<nav class="dock" aria-label="פעולות">
  <button id="btn-main" class="btn" type="button">להירשם ולקבל בית</button>
  <button id="btn-dir" class="btn ghost" type="button">תושבים</button>
  <button id="btn-walk" class="btn ghost" type="button">לרחוב</button>
  <button id="btn-reno" class="btn ghost" type="button" hidden>לשפץ</button>
  <button id="btn-chat" class="btn ghost" type="button">צ׳אט</button>
  <button id="btn-map" class="btn" type="button">חזרה למפה</button>
  <button id="btn-all" class="btn ghost icon" type="button" aria-label="מבט על כל העיר"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>

<button id="act" class="btn act" type="button" hidden></button>
<div id="ticket" class="ticket" role="alert" hidden></div>
<div id="drv" class="drv" hidden>
  <div class="drv-top glass" role="status"><b id="drv-n">0</b><small>קמ״ש</small><span id="drv-name"></span></div>
  <button id="drv-exit" class="btn small drv-exit" type="button">לצאת מהרכב</button>
  <div id="drv-rec" class="drv-rec glass" role="status" hidden></div>
  <button id="drv-sl" class="drv-k drv-sig" type="button" aria-label="איתות שמאלה" aria-pressed="false">◀</button>
  <button id="drv-sr" class="drv-k drv-sig" type="button" aria-label="איתות ימינה" aria-pressed="false">▶</button>
  <button id="drv-left" class="drv-k drv-arrow" type="button" aria-label="הגה שמאלה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg></button>
  <button id="drv-right" class="drv-k drv-arrow" type="button" aria-label="הגה ימינה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
  <button id="drv-drift" class="drv-k drv-drift" type="button" hidden>דריפט</button>
  <button id="drv-brake" class="drv-k drv-pedal brake" type="button">ברקס</button>
  <button id="drv-gas" class="drv-k drv-pedal gas" type="button">גז</button>
</div>
<form id="chatbar" class="chatbar glass" hidden autocomplete="off">
  <input id="chat-in" type="text" maxlength="60" placeholder="מה לכתוב לכולם?" enterkeyhint="send" aria-label="הודעה שתופיע מעל הראש שלך">
  <button id="chat-go" class="btn small" type="submit">לשלוח</button>
  <button id="chat-x" class="x" type="button" aria-label="לסגור את הצ׳אט">✕</button>
  <p class="chatline"><span id="chat-note" role="status"></span><button id="chat-mute" type="button"></button></p>
</form>
<div id="mysay" class="mysay" hidden role="status"><span id="mysay-t"></span><i></i></div>
<div id="shift" class="shiftbar glass" hidden role="status" aria-label="משמרת">
  <span id="sh-time" class="sh-time">10:00</span><span id="sh-job" class="sh-job"></span><span id="sh-count" class="sh-count"></span>
  <button id="sh-end" class="sh-end" type="button">לסיים</button>
  <span class="sh-line"><i id="sh-arrow" class="sh-arrow" aria-hidden="true">↑</i><span id="sh-next"></span></span><i id="sh-bar" class="sh-bar"></i>
</div>
<section id="stall" class="stall glass" hidden aria-label="הדוכן">
  <div class="st-order"><b id="st-who"></b><span id="st-text"></span><i class="st-pat"><i id="st-bar"></i></i></div>
  <div class="st-rows" id="st-rows"></div>
  <div class="st-foot"><span id="st-note" role="status"></span><button id="st-serve" class="btn" type="button">להגיש</button></div>
</section>
<section id="reno" class="renobar glass" hidden aria-label="מצב שיפוץ"></section>
<div id="fade" class="fade"></div>
<div id="veil" class="veil"><div class="glass"><b>NACHSHON CITY</b><span>בונים את העיר…</span></div></div>
<section id="game" class="game" hidden role="dialog" aria-modal="true" aria-labelledby="game-title">
  <header class="game-head"><h2 id="game-title"></h2><span id="game-score" class="gscore" role="status"></span><button id="game-x" class="x" type="button" aria-label="לצאת מהחוג">✕</button></header>
  <div id="game-body" class="game-body"></div>
</section>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
<div id="toast" class="toast" role="status" hidden></div>
<script src="firebase-config.js"></script>
<script>
/* ---- firebase.js: the game on a site of its own (GitHub Pages) ----
   Inside Claude the page asked Claude for three things: shared data (`db`), who is playing (`user`) and who is here
   right now (`room`). Here Firebase gives the same three: Cloud Firestore for the data, Firebase Authentication
   (Google, or a guest without an account) for the player, and the Realtime Database for who is online. This script
   answers window.claude.use(...) exactly the way the game expects, so the game itself did not change.
   The project's settings live in firebase-config.js. Pictures on the events board are not part of this version. */
(() => {
  'use strict';
  if (window.claude && typeof window.claude.use === 'function') return;            // opened inside Claude: its own services are used

  /* ---------- settings ---------- */
  const pick = () => {                                                              // FIREBASE_CONFIG, or the `firebaseConfig` that Firebase's own snippet declares
    if (window.FIREBASE_CONFIG && typeof window.FIREBASE_CONFIG === 'object') return window.FIREBASE_CONFIG;
    try { if (typeof firebaseConfig === 'object' && firebaseConfig) return firebaseConfig; } catch (e) { /* not declared */ }   // eslint-disable-line no-undef
    return null;
  };
  const CFG = pick(), OWNER = String(window.OWNER_EMAIL || '').trim().toLowerCase(), OWNER_HASH = String(window.OWNER_EMAIL_SHA256 || '').trim().toLowerCase();   // the mayor's address, plain or as a SHA-256 hash (so a public site does not show it)
  const filled = v => typeof v === 'string' && v.length > 3 && !/PASTE|YOUR_|הדביקו/i.test(v);
  const configOk = !!CFG && filled(CFG.apiKey) && filled(CFG.projectId) && filled(CFG.appId);

  /* ---------- the window in front of the town: sign in, or say what is missing ---------- */
  const CSS = '.fb-gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(15,19,28,.5)}.fb-gate[hidden]{display:none}'
    + '.fb-card{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--paper,#fffdf6);color:var(--ink,#1b2130);border:3px solid var(--ink,#1b2130);border-radius:22px;padding:18px 18px 16px;box-shadow:0 8px 0 rgba(27,33,48,.25);text-align:center;display:flex;flex-direction:column;gap:10px}'
    + '.fb-card b{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;letter-spacing:.05em;direction:ltr}.fb-card p{margin:0}.fb-card .btn{width:100%}.fb-card .err:empty{display:none}.fb-card .err{margin:0}';
  let gate = null, gateErr = null, busy = false;
  function show(kind, text) {
    if (!gate) {
      const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      gate = document.createElement('div'); gate.className = 'fb-gate'; gate.setAttribute('role', 'dialog'); gate.setAttribute('aria-modal', 'true'); gate.setAttribute('aria-labelledby', 'fb-title');
      gate.appendChild(document.createElement('div')).className = 'fb-card'; document.body.appendChild(gate);
    }
    const card = gate.firstChild; card.replaceChildren();
    const add = (tag, cls, txt, attrs) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; for (const k in (attrs || {})) e.setAttribute(k, attrs[k]); card.appendChild(e); return e; };
    add('b', null, 'NACHSHON CITY', { id: 'fb-title' });
    let first;
    if (kind === 'signin') {
      add('p', null, 'כדי להירשם לעיר, לשמור את הבית ולשחק עם חברים, מתחברים:');
      first = add('button', 'btn', 'התחברות עם Google', { type: 'button' }); first.addEventListener('click', () => signIn('google'));
      add('button', 'btn ghost', 'כניסה בלי חשבון', { type: 'button' }).addEventListener('click', () => signIn('guest'));
      add('p', 'note', 'בכניסה בלי חשבון, התושב שלך שמור רק בדפדפן הזה. מחשב או טלפון אחר יקבלו תושב חדש.');
      gateErr = add('p', 'err', text || '', { role: 'alert' });
    } else {
      add('p', null, text);
      first = add('button', 'btn ghost', 'להמשיך בלי חיבור', { type: 'button' }); first.addEventListener('click', hide);
    }
    gate.hidden = false; setTimeout(() => first.focus(), 30);
  }
  function hide() { if (gate) gate.hidden = true; }
  const told = new Set();
  function note(key, text) { console.warn('Nachshon City / Firebase:', key); if (told.has(key)) return; told.add(key); show('note', text); }

  if (!configOk) {
    note('config', 'Firebase עוד לא מוגדר: בקובץ firebase-config.js צריך להדביק את ההגדרות של הפרויקט מ-Firebase. עד אז העיר עובדת בלי תושבים ובלי חיבור לחברים.');
    return;                                                                        // without window.claude the game runs on its own, as before
  }

  /* ---------- the Firebase libraries: from Google's site, or from cdnjs if that one is blocked ---------- */
  const VER = '12.15.0', FROM = [n => `https://www.gstatic.com/firebasejs/${VER}/firebase-${n}-compat.js`, n => `https://cdnjs.cloudflare.com/ajax/libs/firebase/${VER}/firebase-${n}-compat.min.js`];
  const loadOne = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = false; s.onload = res; s.onerror = () => { s.remove(); rej(new Error(src)); }; document.head.appendChild(s); });
  const loadLib = async n => { let err; for (const url of FROM) { try { return await loadOne(url(n)); } catch (e) { err = e; } } throw err; };
  async function loadSdk() {
    if (window.firebase && window.firebase.auth && window.firebase.firestore && window.firebase.database) return;
    if (!(window.firebase && window.firebase.initializeApp)) await loadLib('app');
    await Promise.all(['auth', 'firestore', 'database'].map(loadLib));
  }

  /* ---------- signing in ---------- */
  function authMsg(e) {
    const c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' || c === 'auth/user-cancelled') return '';
    if (c === 'auth/unauthorized-domain') return `הכתובת ${location.hostname} לא מאושרת ב-Firebase. מוסיפים אותה ב-Authentication > Settings > Authorized domains.`;
    if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'שיטת ההתחברות הזאת כבויה ב-Firebase. מפעילים אותה ב-Authentication > Sign-in method.';
    if (c === 'auth/configuration-not-found') return 'צריך קודם להפעיל את Authentication בפרויקט של Firebase.';
    if (c === 'auth/network-request-failed') return 'אין חיבור לאינטרנט. בודקים את החיבור ומנסים שוב.';
    return 'ההתחברות לא הצליחה' + (c ? ` (${c})` : '') + '. נסו שוב.';
  }
  async function signIn(how) {
    if (busy || !window.firebase) return; busy = true; if (gateErr) gateErr.textContent = '';
    const auth = firebase.auth();
    try {
      if (how === 'guest') await auth.signInAnonymously();
      else {
        const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
        try { await auth.signInWithPopup(p); } catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await auth.signInWithRedirect(p); else throw e; }
      }
    } catch (e) { console.warn('sign-in', e && e.code); if (gateErr) gateErr.textContent = authMsg(e); } finally { busy = false; }
  }
  let booted = null;
  function boot() {                                                                // the signed-in player, once there is one; null if Firebase cannot be reached
    return booted || (booted = (async () => {
      try { await loadSdk(); } catch (e) { note('sdk', 'לא הצלחתי לטעון את Firebase. בודקים את החיבור לאינטרנט ומרעננים את הדף.'); return null; }
      try { if (!firebase.apps.length) firebase.initializeApp(CFG); } catch (e) { console.error(e); note('init', 'ההגדרות ב-firebase-config.js לא תקינות. מעתיקים אותן שוב מ-Firebase.'); return null; }
      const auth = firebase.auth();
      auth.getRedirectResult().catch(e => { const m = authMsg(e); if (m) show('signin', m); });
      return new Promise(resolve => { let asked = false; auth.onAuthStateChanged(u => { if (u) { hide(); resolve(u); } else if (!asked) { asked = true; show('signin'); } }); });
    })());
  }

  /* ---------- `user`: who is playing, and whether it is the town's owner (the mayor) ---------- */
  const sha256 = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
  function userApi(u) {
    const email = String(u.email || '').trim().toLowerCase(), may = !u.isAnonymous && u.emailVerified !== false && !!email;
    const owner = !may ? Promise.resolve(false) : OWNER ? Promise.resolve(email === OWNER) : OWNER_HASH ? sha256(email).then(h => h === OWNER_HASH, () => false) : Promise.resolve(false);
    return { isOwner: () => owner, canEdit: () => owner, can: async n => (n === 'data.write' ? true : owner), id: async () => u.uid, me: async () => ({ id: u.uid, name: u.displayName || '' }), profiles: async () => ({}) };
  }

  /* ---------- `db`: the town's shared documents, in Cloud Firestore ---------- */
  const CODES = { 'permission-denied': 'not_granted', unauthenticated: 'not_granted', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'quota_exceeded' };
  const plain = d => JSON.parse(JSON.stringify(d));                                 // Firestore refuses `undefined`; the game never needs it
  function readFail(e) {
    const c = (e && e.code) || '';
    if (c === 'permission-denied') note('rules', 'Firebase לא נותן לקרוא את נתוני העיר. בודקים שהחוקים מהקובץ firestore.rules הודבקו בלשונית Rules של Firestore, ושלחצתם Publish.');
    else if (c === 'not-found' || c === 'failed-precondition') note('nofs', 'בפרויקט של Firebase עוד אין מסד נתונים Firestore. יוצרים אותו ב-Firestore > Create database.');
    else note('read-' + c, 'החיבור לנתוני העיר נכשל' + (c ? ` (${c})` : '') + '. מרעננים את הדף ומנסים שוב.');
  }
  function dbApi(fs) {
    return {
      collection: n => ({ onSnapshot: (next, err) => fs.collection(n).onSnapshot(next, e => { readFail(e); if (err) err(e); }) }),

function start(saved) {

  $('#hint').textContent = window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'אצבע אחת מזיזה · שתי אצבעות מסובבות, מטות ומקרבות · מקישים על בית' : 'גוררים כדי לזוז · כפתור ימני או Shift מסובב ומטה · הגלגלת מקרבת · לוחצים על בית';
  connect();
  const c = saved && saved.cam; keepView = !!c;
  requestAnimationFrame(() => setTimeout(() => {           // one painted frame first, then the heavy set-up
    has3d = R3.init(cvs, { onTap: id => { hideHint(); select(id || null); }, onMove: drawn => { if (drawn) layoutOverlay(); else hideHint(); } });
    if (has3d) {
      const num = (v, d, lo, hi) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
      Object.assign(R3.cam, OVERVIEW, c ? { tx: num(c.tx, 4, -260, 260), tz: num(c.tz, -6, -290, 260), dist: num(c.dist, 150, 16, 520), az: num(c.az, .55, -100, 100), tilt: num(c.tilt, .6, .2, 1.5) } : null);

    } else { $('#nogl').hidden = false; document.querySelector('.ctrl').hidden = true; $('#btn-all').hidden = true; $('#btn-walk').hidden = true; hideHint(); }
    const veil = $('#veil'); veil.classList.add('gone'); setTimeout(() => veil.remove(), 900);
    setTimeout(hideHint, 11000);
  }, 40));
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ cam: { tx: R3.cam.tx, tz: R3.cam.tz, dist: R3.cam.dist, az: R3.cam.az, tilt: R3.cam.tilt } }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
